[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeforge"
version = "0.1.0.dev0"
description = "OPENBVE 루트를 2D/3D에서 직접 그리고 CSV로 추출하는 데스크톱 에디터"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RouteForge Contributors" }]
keywords = ["openbve", "railway", "route-editor", "csv", "pyqt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "PyQt6>=6.6",
    "matplotlib>=3.8",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
routeforge = "routeforge.__main__:main"

[project.urls]
Homepage = "https://github.com/<your-org>/routeforge"
Repository = "https://github.com/<your-org>/routeforge.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["routeforge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]